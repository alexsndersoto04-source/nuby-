plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nuby.studio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nuby.studio'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4.0'
    }

    /**
     * Firma fija: la clave está en android/nuby-release.p12 (ver README).
     * Al ser siempre la misma, una versión nueva se instala encima de la anterior
     * sin tener que desinstalar.
     */
    signingConfigs {
        release {
            storeFile rootProject.file('nuby-release.p12')
            storeType 'PKCS12'
            storePassword 'nuby-studio-apk'
            keyAlias 'nuby'
            keyPassword 'nuby-studio-apk'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // La compilación no se detiene por avisos de estilo: aquí interesa el APK.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

/**
 * Copia la app web (index.html, css, js, assets…) dentro del APK antes de compilar.
 * Así el APK siempre lleva la última versión del estudio, sin duplicar archivos
 * en el repositorio: el WebView los abre como si fueran un sitio https://localhost.
 */
def webRoot = rootProject.projectDir.parentFile

tasks.register('copyWebAssets', Copy) {
    description = 'Copia el estudio web dentro del APK'
    from(webRoot) {
        include 'index.html'
        include 'manifest.webmanifest'
        include 'css/**'
        include 'js/**'
        include 'assets/**'
        include 'js/vendor/**'   // codificador MP3 (lamejs)
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}

tasks.named('preBuild').configure {
    dependsOn 'copyWebAssets'
}

tasks.register('cleanWebAssets', Delete) {
    delete layout.projectDirectory.dir('src/main/assets/www')
}

clean.dependsOn cleanWebAssets
