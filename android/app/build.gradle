apply plugin: 'com.android.application'

android {
    namespace 'com.nuby.browser'
    compileSdk 34
    defaultConfig {
        applicationId 'com.nuby.browser'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.4.1'
        externalNativeBuild { cmake { cppFlags '-std=c++20 -Wall -Wextra' } }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    buildFeatures { buildConfig true }
}
