<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Página de inicio nativa del navegador Nuby">
  <title>Nuby</title>
  <style>
    :root { --blue:#1a73e8; --blue-soft:#e8f0fe; --bg:#f8f9fa; --surface:#fff; --text:#202124; --muted:#5f6368; --line:#dadce0; --shadow:0 4px 18px rgba(60,64,67,.16); font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:light; }
    [data-theme="dark"] { --blue:#8ab4f8; --blue-soft:#283b55; --bg:#202124; --surface:#292a2d; --text:#e8eaed; --muted:#bdc1c6; --line:#5f6368; --shadow:0 5px 20px rgba(0,0,0,.42); color-scheme:dark; }
    * { box-sizing:border-box; } html,body { min-height:100%; } body { margin:0; color:var(--text); background:var(--bg); transition:background .2s,color .2s; }
    button,input { font:inherit; } button { -webkit-tap-highlight-color:transparent; } svg { display:block; }
    .app { min-height:100dvh; display:grid; grid-template-rows:auto 1fr auto; padding-bottom:76px; }
    header { height:68px; padding:0 clamp(18px,4vw,42px); display:flex; align-items:center; justify-content:space-between; }
    .logo { color:var(--text); text-decoration:none; font-size:24px; font-weight:300; letter-spacing:-.7px; }
    .avatar { width:36px; height:36px; border:0; border-radius:50%; color:var(--text); background:#e1e3e1; cursor:pointer; font-size:14px; transition:transform .2s,background .2s; }
    .avatar:hover { transform:scale(1.06); background:#d1d4d1; }
    main { min-height:0; display:flex; align-items:center; justify-content:center; padding:20px 24px 88px; }
    .home { width:min(100%,580px); text-align:center; transform:translateY(-7%); }
    .wordmark { margin:0 0 31px; color:var(--text); font-size:clamp(46px,9vw,72px); font-weight:300; letter-spacing:-3px; }
    .wordmark b { color:var(--blue); font-weight:400; }
    .search-form { position:relative; display:flex; align-items:center; height:60px; border:1px solid var(--line); border-radius:30px; background:var(--surface); box-shadow:0 2px 10px rgba(0,0,0,.08); transition:box-shadow .2s,border-color .2s; }
    .search-form:focus-within { border-color:transparent; box-shadow:0 3px 15px rgba(60,64,67,.2); }
    .search-icon { flex:0 0 auto; width:21px; margin-left:20px; color:var(--muted); }
    .search-form input { min-width:0; flex:1; height:100%; border:0; outline:0; padding:0 12px; background:transparent; color:var(--text); font-size:16px; }
    .search-form input::placeholder { color:var(--muted); opacity:1; }
    .mic { display:grid; place-items:center; flex:0 0 auto; width:44px; height:44px; margin-right:8px; border:0; border-radius:50%; color:var(--blue); background:transparent; cursor:pointer; transition:background .2s; }
    .mic:hover,.mic:focus-visible { background:var(--blue-soft); outline:0; } .mic svg { width:21px; }
    .hint { margin:18px 0 0; color:var(--muted); font-size:13px; }
    footer { align-self:end; padding:0 20px 14px; color:var(--muted); font-size:12px; text-align:center; }
    .bottom-nav { position:fixed; z-index:20; bottom:0; left:0; right:0; height:76px; padding-bottom:env(safe-area-inset-bottom); border-top:1px solid var(--line); background:var(--surface); transition:background .2s,border-color .2s; }
    .nav-list { width:min(620px,100%); height:100%; margin:auto; padding:0 6px; display:grid; grid-template-columns:repeat(5,1fr); }
    .nav-button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-width:0; border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:11px; transition:color .2s,background .2s; }
    .nav-button svg { width:22px; height:22px; stroke-width:1.8; } .nav-button:hover,.nav-button:focus-visible,.nav-button.active { color:var(--blue); outline:0; } .nav-button.active svg { fill:var(--blue-soft); }
    .popover { position:fixed; z-index:30; bottom:87px; left:50%; width:min(370px,calc(100vw - 28px)); padding:8px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:var(--shadow); opacity:0; visibility:hidden; pointer-events:none; transform:translate(-50%,10px) scale(.98); transition:opacity .2s,transform .2s,visibility .2s; }
    .popover.open { opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%,0) scale(1); }
    .popover-head { padding:10px 12px 7px; color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.7px; }
    .menu-action,.settings-row { width:100%; border:0; border-radius:10px; color:var(--text); background:transparent; cursor:pointer; text-align:left; transition:background .2s,color .2s; }
    .menu-action { display:flex; align-items:center; gap:14px; min-height:47px; padding:10px 12px; font-size:14px; } .menu-action svg { width:20px; color:var(--muted); }
    .menu-action:hover,.menu-action:focus-visible,.settings-row:hover { color:var(--blue); background:var(--blue-soft); outline:0; }
    .separator { height:1px; margin:7px 4px; background:var(--line); }
    .settings-row { display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:8px; min-height:50px; padding:8px 10px; }
    .settings-row>svg { width:20px; color:var(--muted); } .setting-title { display:block; font-size:14px; } .setting-value { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
    .chevron { width:17px!important; color:var(--muted); } .about { padding:11px 12px 8px; color:var(--muted); font-size:12px; line-height:1.5; }
    .toast { position:fixed; z-index:50; left:50%; bottom:96px; max-width:calc(100vw - 36px); padding:11px 16px; border-radius:9px; color:#fff; background:#303134; box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transform:translate(-50%,15px); transition:opacity .2s,transform .2s; } .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:480px) { header { height:60px; padding:0 18px; } .app { padding-bottom:70px; } main { padding:12px 17px 70px; align-items:center; } .home { transform:translateY(-10%); } .wordmark { margin-bottom:25px; } .search-form { height:56px; } .bottom-nav { height:70px; } .nav-button { font-size:10px; } .nav-button svg { width:21px; } footer { padding-bottom:9px; font-size:11px; } .popover { bottom:80px; } }
  </style>
</head>
<body>
  <div class="app">
    <header><a class="logo" href="#inicio" aria-label="Nuby, inicio">Nuby</a><button class="avatar" type="button" aria-label="Perfil de Nuby">N</button></header>
    <main id="inicio"><section class="home" aria-labelledby="title"><h1 class="wordmark" id="title">Nu<b>by</b></h1><form class="search-form" role="search" id="search-form"><svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4" stroke-linecap="round"/></svg><input id="search" name="q" aria-label="Buscar en Nuby" placeholder="Buscar en Nuby..." autocomplete="off"><button class="mic" type="button" id="voice-search" aria-label="Búsqueda por voz"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></button></form><p class="hint">Busca rápidamente en la web con Nuby</p></section></main>
    <footer>Nuby v2.4.1 — Hecho con ❤️ para navegadores modernos.</footer>
  </div>
  <nav class="bottom-nav" aria-label="Navegación principal"><div class="nav-list">
    <button class="nav-button active" data-action="home" type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
    <button class="nav-button" data-action="search" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4 4" stroke-linecap="round"/></svg><span>Buscar</span></button>
    <button class="nav-button" data-action="favorites" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" stroke-linejoin="round"/></svg><span>Favoritos</span></button>
    <button class="nav-button" data-popover="settings-popover" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.7 2.7-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V21h-3.8v-.09a1.7 1.7 0 0 0-1.03-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.7-2.7.06-.06A1.7 1.7 0 0 0 5.06 15a1.7 1.7 0 0 0-1.55-1.03H3.4v-3.8h.11A1.7 1.7 0 0 0 5.06 9.14a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.7-2.7.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.55V3.3h3.8v.05a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.7 2.7-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.03h.05v3.8h-.05A1.7 1.7 0 0 0 19.4 15Z" stroke-linejoin="round"/></svg><span>Configuración</span></button>
    <button class="nav-button" data-popover="menu-popover" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg><span>Menú</span></button>
  </div></nav>
  <section class="popover" id="settings-popover" aria-label="Configuración de Nuby"><div class="popover-head">Configuración</div>
    <button class="settings-row" data-message="Idioma: Español"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 4 5.8 4 9s-1 5.8-4 9c-3-3.2-4-5.8-4-9s1-5.8 4-9"/></svg><span><span class="setting-title">Idioma</span><span class="setting-value">Español · Inglés · Portugués</span></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="settings-row" id="theme-control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke-linecap="round"/></svg><span><span class="setting-title">Tema</span><span class="setting-value" id="theme-label">Claro</span></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="settings-row" data-message="Privacidad: datos, cookies e historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span><span class="setting-title">Privacidad</span><span class="setting-value">Datos, cookies e historial</span></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="settings-row" id="sync-control"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 12a8 8 0 0 0-14.9-4M4 4v4h4M4 12a8 8 0 0 0 14.9 4M20 20v-4h-4" stroke-linecap="round" stroke-linejoin="round"/></svg><span><span class="setting-title">Sincronización</span><span class="setting-value" id="sync-label">Desactivada</span></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m9 18 6-6-6-6"/></svg></button>
    <div class="separator"></div><div class="about"><strong>Acerca de Nuby</strong><br>Versión 2.4.1 · Creado para una navegación mejor.</div>
  </section>
  <section class="popover" id="menu-popover" aria-label="Menú de Nuby"><div class="popover-head">Menú</div>
    <button class="menu-action" data-message="Descargas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v11m-4-4 4 4 4-4M5 20h14" stroke-linecap="round" stroke-linejoin="round"/></svg>Descargas</button><button class="menu-action" data-message="Historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>Historial</button><button class="menu-action" data-message="Imprimir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 15h10v6H7z" stroke-linejoin="round"/></svg>Imprimir</button><button class="menu-action" data-message="Herramientas de desarrollo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m8 9-3 3 3 3m8-6 3 3-3 3M14 6l-4 12" stroke-linecap="round" stroke-linejoin="round"/></svg>Herramientas de desarrollo</button><button class="menu-action" data-message="Ayuda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.3 2.3 0 1 1 3.9 1.7c-1.3 1.1-1.7 1.5-1.7 3M12 17.2v.1" stroke-linecap="round"/></svg>Ayuda</button>
  </section><div class="toast" role="status" aria-live="polite" id="toast"></div>
  <script>
    (() => { const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], toast=$('#toast'); let toastTimer;
      const showToast=t=>{toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)};
      const close=()=>{$$('.popover').forEach(p=>p.classList.remove('open'));$$('[data-popover]').forEach(b=>b.setAttribute('aria-expanded','false'))};
      $$('[data-popover]').forEach(b=>b.onclick=e=>{e.stopPropagation();let p=$('#'+b.dataset.popover), open=!p.classList.contains('open');close();if(open){p.classList.add('open');b.setAttribute('aria-expanded','true')}});
      document.addEventListener('click',e=>{if(!e.target.closest('.popover'))close()}); document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
      $('#search-form').onsubmit=e=>{e.preventDefault();let q=$('#search').value.trim();if(q)location.href='https://www.google.com/search?q='+encodeURIComponent(q)};
      $$('[data-action]').forEach(b=>b.onclick=()=>{close();$$('.nav-button').forEach(x=>{x.classList.remove('active');x.removeAttribute('aria-current')});b.classList.add('active');b.setAttribute('aria-current','page');if(b.dataset.action==='search')$('#search').focus();else if(b.dataset.action==='favorites')showToast('No tienes favoritos todavía.');else if(b.dataset.action==='home')$('#inicio').scrollIntoView({behavior:'smooth'})});
      $('#voice-search').onclick=()=>showToast('La búsqueda por voz estará disponible próximamente.');
      $('#theme-control').onclick=()=>{let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('#theme-label').textContent=dark?'Oscuro':'Claro';document.querySelector('meta[name="theme-color"]').content=dark?'#202124':'#ffffff';showToast('Tema '+(dark?'oscuro':'claro')+' activado.');};
      $('#sync-control').onclick=()=>{let el=$('#sync-label'),on=el.textContent==='Desactivada';el.textContent=on?'Activada':'Desactivada';showToast('Sincronización '+(on?'activada.':'desactivada.'));}; $$('[data-message]').forEach(b=>b.onclick=()=>showToast(b.dataset.message));
    })();
  </script>
</body></html>
