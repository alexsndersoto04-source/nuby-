name: Nuby — rastreo real del índice (web abierta)

# ============================================================================
#  Este workflow hace el trabajo que NO se puede hacer en un sandbox sin
#  internet: rastrear la web abierta de verdad, en las máquinas de GitHub,
#  gratis y sin tarjeta (repos públicos = minutos ilimitados).
#
#  • Corre cada 6 horas (y a mano con workflow_dispatch).
#  • Es respetuoso: robots.txt, 1 req/s por dominio, topes por dominio.
#  • Commitea sus resultados → actividad del repo → el cron NO se desactiva
#    a los 60 días (la trampa documentada de los repos públicos).
#  • El commit lleva la marca "nuby-crawl:" para que este workflow no se
#    re-dispare a sí mismo en bucle (el deploy de Pages sí corre en main).
# ============================================================================

on:
  push:
    branches: [ 'arena/**', 'main' ]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Páginas máximas en esta corrida'
        default: '500'
      max_seconds:
        description: 'Segundos máximos de rastreo'
        default: '900'

permissions:
  contents: write

concurrency:
  group: nuby-crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    # Evita el bucle: si el commit es del propio rastreador, este job no corre.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'nuby-crawl:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del rastreador
        run: pip install -r crawler/requirements.txt

      - name: Rastrear la web abierta (robots.txt respetado)
        env:
          NUBY_MAX_PAGES: ${{ github.event.inputs.max_pages || '500' }}
          NUBY_MAX_SECONDS: ${{ github.event.inputs.max_seconds || '900' }}
          NUBY_PER_DOMAIN: '20'
          NUBY_DELAY: '1.0'
          NUBY_WORKERS: '12'
        run: python3 crawler/nuby_crawler.py --seeds crawler/seeds.txt --data crawler/data

      - name: Construir el índice del motor + medirlo
        run: python3 crawler/build_index.py

      - name: Verificar que el MOTOR C++ carga el índice nuevo
        run: |
          g++ -std=c++20 -O2 -pthread -I nuby_engine/include \
              crawler/verify_engine.cpp nuby_engine/src/core/types.cpp \
              -o /tmp/verify_engine
          /tmp/verify_engine nuby_engine/data/crawl_pages.tsv "inteligencia artificial"

      - name: Resumen en la página del workflow
        if: always()
        run: |
          {
            echo "## Rastreo Nuby"
            echo ""
            if [ -f crawler/data/index_stats.json ]; then
              echo '```json'
              cat crawler/data/index_stats.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar los datos del rastreo (siempre, por si algo falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuby-crawl-data
          path: |
            crawler/data/
            nuby_engine/data/crawl_pages.tsv
          if-no-files-found: warn

      - name: Publicar el índice en el repositorio (queda para el motor)
        run: |
          set -e
          git config user.name  "Nuby Crawler"
          git config user.email "crawler@users.noreply.github.com"
          git add crawler/data nuby_engine/data/crawl_pages.tsv
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          NEW=$(python3 -c "import json;print(json.load(open('crawler/data/index_stats.json'))['pages_new'])")
          TOTAL=$(python3 -c "import json;print(json.load(open('crawler/data/index_stats.json'))['pages'])")
          DOM=$(python3 -c "import json;print(json.load(open('crawler/data/index_stats.json'))['domains'])")
          git commit -q -m "nuby-crawl: +${NEW} páginas (${TOTAL} en el índice, ${DOM} dominios)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
