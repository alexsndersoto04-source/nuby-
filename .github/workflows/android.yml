name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene-tests:
    name: Test engine scene core
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Compile scene tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/scene.cpp tests/scene_tests.cpp
          -o /tmp/nuby-scene-tests

      - name: Run scene tests
        run: /tmp/nuby-scene-tests

      - name: Compile and run OBJ asset tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/obj_loader.cpp tests/obj_loader_tests.cpp
          -o /tmp/nuby-obj-tests
          && /tmp/nuby-obj-tests

  build-debug-apk:
    name: Build native Android APK
    needs: scene-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuby-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
