name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene-tests:
    name: Test engine scene core
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Compile scene tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/scene.cpp tests/scene_tests.cpp
          -o /tmp/nuby-scene-tests

      - name: Run scene tests
        run: /tmp/nuby-scene-tests

      - name: Compile and run OBJ asset tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/obj_loader.cpp tests/obj_loader_tests.cpp
          -o /tmp/nuby-obj-tests
          && /tmp/nuby-obj-tests

      - name: Compile and run TGA image asset tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/image_loader.cpp tests/image_loader_tests.cpp
          -o /tmp/nuby-image-tests
          && /tmp/nuby-image-tests

      - name: Compile and run Wavefront material tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/mtl_loader.cpp tests/mtl_loader_tests.cpp
          -o /tmp/nuby-mtl-tests
          && /tmp/nuby-mtl-tests

      - name: Compile and run scene serialization tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/scene.cpp app/src/main/cpp/src/scene_io.cpp
          tests/scene_io_tests.cpp -o /tmp/nuby-scene-io-tests
          && /tmp/nuby-scene-io-tests

      - name: Compile and run sample game tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/scene.cpp app/src/main/cpp/src/sample_game.cpp
          tests/sample_game_tests.cpp -o /tmp/nuby-sample-game-tests
          && /tmp/nuby-sample-game-tests

      - name: Compile and run adventure game tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/scene.cpp app/src/main/cpp/src/adventure_game.cpp
          tests/adventure_game_tests.cpp -o /tmp/nuby-adventure-game-tests
          && /tmp/nuby-adventure-game-tests

      - name: Compile and run directional shadow cascade tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/shadow_cascades.cpp tests/shadow_cascades_tests.cpp
          -o /tmp/nuby-shadow-tests && /tmp/nuby-shadow-tests

      - name: Compile and run standalone project tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/scene.cpp app/src/main/cpp/src/scene_io.cpp
          app/src/main/cpp/src/game_project.cpp tests/game_project_tests.cpp
          -o /tmp/nuby-game-project-tests && /tmp/nuby-game-project-tests

      - name: Compile and run project runtime lifecycle tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          -Iapp/src/main/cpp/include
          app/src/main/cpp/src/scene.cpp app/src/main/cpp/src/scene_io.cpp
          app/src/main/cpp/src/game_project.cpp
          app/src/main/cpp/src/game_project_runtime.cpp
          tests/game_project_runtime_tests.cpp
          -o /tmp/nuby-game-project-runtime-tests
          && /tmp/nuby-game-project-runtime-tests

  build-debug-apk:
    name: Build native Android APK
    needs: scene-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android build components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee /tmp/nuby-gradle.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            diagnostics=$(grep -Ei 'error:|fatal error:|undefined reference|ninja:|failed|no such file|not declared|cannot convert|no matching function|does not name|has no member|invalid' /tmp/nuby-gradle.log | tail -n 25 || true)
            if [ -z "$diagnostics" ]; then
              diagnostics=$(tail -n 20 /tmp/nuby-gradle.log)
            fi
            while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              echo "::error file=.github/workflows/android.yml,line=1::$safe"
            done <<< "$diagnostics"
            exit "$result"
          fi

      - name: Publish APK artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[apk-milestone]'))
        uses: actions/upload-artifact@v6
        with:
          name: nuby-engine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
