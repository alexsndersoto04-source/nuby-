<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f9fa">
<title>Nuby</title>
<style>
  :root {
    --tinta: #202124;
    --gris: #5f6368;
    --linea: #dfe1e5;
    --acento: #1a73e8;
    --alto-barra: 40px;
    --alto-estado: 22px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #f8f9fa;
    color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  /* --- barra superior del producto (no es la interfaz del motor) --- */
  .barra {
    height: var(--alto-barra);
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px;
    padding-top: env(safe-area-inset-top);
    box-sizing: content-box;
    background: #fff;
    border-bottom: 1px solid var(--linea);
  }
  .marca { font-size: 17px; font-weight: 500; letter-spacing: -.2px; }
  .marca b { color: var(--acento); font-weight: 500; }
  .empuje { flex: 1 1 auto; }
  .barra a, .barra button {
    font: inherit; font-size: 13px; color: var(--gris);
    text-decoration: none; background: none; border: 0;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
  }
  .barra a:hover, .barra button:hover { background: #f1f3f4; color: var(--tinta); }
  .barra button[aria-pressed="true"] { background: #e8f0fe; color: var(--acento); }

  /* --- pantalla: aquí vive el motor --- */
  .pantalla {
    flex: 1 1 auto;
    min-height: 0;              /* imprescindible para que el flex no se desborde */
    position: relative;
    background: #fff;
  }
  #nuby-screen {
    display: block;
    width: 100%; height: 100%;
    touch-action: none;          /* el scroll lo maneja el motor, no el navegador */
    outline: none;
    cursor: default;
  }

  /* --- línea de estado (información real del motor) --- */
  .estado {
    flex: 0 0 auto;
    height: var(--alto-estado);
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 12px;
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: content-box;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--gris);
    background: #fff;
    border-top: 1px solid var(--linea);
    overflow: hidden; white-space: nowrap;
  }
  #nuby-stat { overflow: hidden; text-overflow: ellipsis; }
  #nuby-note { color: #b3261e; }

  /* --- campo oculto: es lo que abre el teclado en un móvil --- */
  #nuby-keys {
    position: fixed;
    bottom: 0; left: 50%;
    width: 1px; height: 1px;
    padding: 0; border: 0;
    opacity: 0.01;
    font-size: 16px;             /* 16px evita el zoom automático de iOS */
    caret-color: transparent;
    transform: translateX(-50%);
  }
</style>
</head>
<body data-base="./">

  <header class="barra">
    <span class="marca">Nu<b>by</b></span>
    <span class="empuje"></span>
    <button id="btn-full" title="Pantalla completa" aria-pressed="false">Pantalla completa</button>
    <a href="about.html">Acerca de</a>
  </header>

  <main class="pantalla" id="nuby-shell">
    <canvas id="nuby-screen" width="1024" height="640" tabindex="0" aria-label="Nuby"></canvas>
  </main>

  <div class="estado">
    <span id="nuby-stat">Iniciando el motor…</span>
    <span id="nuby-note"></span>
  </div>

  <input id="nuby-keys" type="text" autocomplete="off" autocorrect="on"
         autocapitalize="sentences" spellcheck="false" aria-hidden="true" tabindex="-1">

<script src="nuby-wasi.js"></script>
<script src="nuby.js"></script>
<script>
  // Pantalla completa: el usuario decide, no se fuerza nunca.
  const btnFull = document.getElementById("btn-full");
  const shell = document.getElementById("nuby-shell");
  btnFull.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await (shell.requestFullscreen ? shell.requestFullscreen()
                                       : shell.webkitRequestFullscreen());
      } else {
        await (document.exitFullscreen ? document.exitFullscreen()
                                       : document.webkitExitFullscreen());
      }
    } catch (e) { /* el navegador lo denegó: no se inventa nada */ }
  });
  document.addEventListener("fullscreenchange", () => {
    btnFull.setAttribute("aria-pressed", document.fullscreenElement ? "true" : "false");
    setTimeout(() => window.dispatchEvent(new Event("resize")), 120);
  });
</script>
</body>
</html>
