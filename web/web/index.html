<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuby</title>
<!--
  Puente de compatibilidad.
  El sitio se publica de dos formas posibles según quién despliegue:
    • con la raíz = la carpeta web/  → la app vive en /index.html
    • con la raíz = el repositorio   → la app vive en /web/index.html
  Esta página existe para que la dirección antigua (/web/index.html) siga
  llevando a la aplicación en vez de mostrar un 404.
-->
<meta http-equiv="refresh" content="0; url=../index.html">
<link rel="canonical" href="../index.html">
<style>
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         color:#202124; background:#f8f9fa; display:flex; align-items:center;
         justify-content:center; min-height:100vh; }
  main { text-align:center; padding:24px; }
  a { color:#1a73e8; }
</style>
</head>
<body>
<main>
  <p>El motor está en <a href="../index.html">la página principal de Nuby</a>.</p>
  <p style="color:#5f6368;font-size:14px">Si no salta solo, pulsa el enlace.</p>
</main>
<script>location.replace(new URL("../index.html", location.href).href);</script>
</body>
</html>
